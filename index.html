<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#130d20">
  <title>LaSalle AJC | TV Display</title>
  <style>
    :root { --divider: #c9a94d; --background: #101014; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--background); font-family: Arial, Helvetica, sans-serif; }
    .display { width: 100vw; height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .video-side, .jobs-side { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    .video-side { display: flex; align-items: center; justify-content: center; background: #08080c; }
    #promo-video { display: block; width: 100%; height: 100%; object-fit: contain; background: #08080c; }
    .jobs-side { border-left: 3px solid var(--divider); background: #f0f0f2; display: flex; align-items: center; justify-content: center; }
    /* Keep the Google document centered vertically, rather than anchored to the top of the screen. */
    .job-frame { display: block; width: 100%; height: 74vh; height: 74dvh; border: 0; background: #fff; flex: none; pointer-events: none; }
    .fullscreen { position: fixed; z-index: 10; bottom: 9px; right: 9px; padding: 5px 8px; background: rgba(23, 15, 38, .84); border: 1px solid rgba(201,169,77,.75); border-radius: 5px; color: #fff; font-size: 10px; cursor: pointer; opacity: 0; transition: opacity .18s; }
    body:hover .fullscreen, .fullscreen:focus-visible { opacity: 1; }
    @media (hover: none) { .fullscreen { opacity: 0; } }
  </style>
</head>
<body>
  <main class="display" aria-label="LaSalle American Job Center digital signage">
    <section class="video-side" aria-label="LWDA 60 silent rotating video">
      <video id="promo-video" src="./tv-video.mp4" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate" aria-label="LWDA 60 video presentation"></video>
    </section>
    <section class="jobs-side" aria-label="LaSalle Parish stationary job board">
      <iframe id="jobs" class="job-frame" title="LaSalle Parish Job Board" loading="eager" referrerpolicy="strict-origin-when-cross-origin" tabindex="-1" src="https://docs.google.com/document/d/1Ohk34LgsE5Bf7J0Ev7fV6eIvS9O5buTRdZfmbJRJv2E/preview"></iframe>
    </section>
  </main>
  <button type="button" class="fullscreen" id="fullscreen" title="Full screen">Full screen</button>
  <script>
    'use strict';
    const JOBS_URL = 'https://docs.google.com/document/d/1Ohk34LgsE5Bf7J0Ev7fV6eIvS9O5buTRdZfmbJRJv2E/preview';
    const ONE_HOUR = 60 * 60 * 1000;
    const video = document.getElementById('promo-video');
    video.muted = true;
    video.defaultMuted = true;
    video.volume = 0;
    const VIDEO_SPEED = 0.75;
    function setVideoSpeed() { video.playbackRate = VIDEO_SPEED; }
    video.addEventListener('loadedmetadata', setVideoSpeed);
    video.addEventListener('ratechange', () => {
      if (video.playbackRate !== VIDEO_SPEED) setVideoSpeed();
    });
    setVideoSpeed();
    function startVideo() {
      video.muted = true;
      setVideoSpeed();
      const attempt = video.play();
      if (attempt && typeof attempt.catch === 'function') attempt.catch(() => {});
    }
    video.addEventListener('canplay', startVideo, { once: true });
    startVideo();
    function refreshJobs() {
      const frame = document.getElementById('jobs');
      // Reload ONLY the Google Doc, never the video or the whole page.
      frame.src = JOBS_URL + '?refresh=' + Date.now();
    }
    window.setInterval(refreshJobs, ONE_HOUR);
    document.getElementById('fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        const result = document.documentElement.requestFullscreen?.();
        if (result && typeof result.catch === 'function') result.catch(() => {});
      } else {
        document.exitFullscreen?.();
      }
    });
  </script>
</body>
</html>
